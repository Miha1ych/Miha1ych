<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="Прыгающий медведь">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f4b"/>
      <stop offset="1" stop-color="#7b5ea7"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9793f"/>
      <stop offset="1" stop-color="#8a5326"/>
    </linearGradient>
  </defs>
  <style>
    .bear   { transform-box: fill-box; transform-origin: 50% 100%; animation: jump 1.6s cubic-bezier(.3,.1,.3,1) infinite; }
    .shadow { transform-box: fill-box; transform-origin: 50% 50%; animation: shadow 1.6s cubic-bezier(.3,.1,.3,1) infinite; }
    .armL   { transform-box: fill-box; transform-origin: 90% 10%; animation: armL 1.6s ease-in-out infinite; }
    .armR   { transform-box: fill-box; transform-origin: 10% 10%; animation: armR 1.6s ease-in-out infinite; }
    .blink  { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 3.2s infinite; }
    .cloud1 { animation: drift 28s linear infinite; }
    .cloud2 { animation: drift 40s linear infinite -15s; }
    .star   { animation: twinkle 2.4s ease-in-out infinite; }
    .s2 { animation-delay: .6s } .s3 { animation-delay: 1.2s } .s4 { animation-delay: 1.8s }
    .dust   { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; animation: dust 1.6s ease-out infinite; }
    .heart  { animation: heart 1.6s ease-out infinite; opacity: 0; }

    @keyframes jump {
      0%   { transform: translateY(0) scale(1.12,.86); }
      12%  { transform: translateY(0) scale(1.12,.86); }
      28%  { transform: translateY(-40px) scale(.94,1.08); }
      50%  { transform: translateY(-115px) scale(1,1); }
      72%  { transform: translateY(-40px) scale(.95,1.07); }
      88%  { transform: translateY(0) scale(1.12,.86); }
      100% { transform: translateY(0) scale(1.12,.86); }
    }
    @keyframes shadow {
      0%,12%,88%,100% { transform: scale(1);   opacity: .45; }
      50%             { transform: scale(.55); opacity: .2; }
    }
    @keyframes armL { 0%,12%,88%,100% { transform: rotate(20deg); } 50% { transform: rotate(-55deg); } }
    @keyframes armR { 0%,12%,88%,100% { transform: rotate(-20deg); } 50% { transform: rotate(55deg); } }
    @keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
    @keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(960px); } }
    @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes dust {
      0%,84% { opacity: 0; transform: scale(.3); }
      90%    { opacity: .8; }
      100%   { opacity: 0; transform: scale(1.8) translateY(-6px); }
    }
    @keyframes heart {
      0%,45% { opacity: 0; transform: translateY(0); }
      55%    { opacity: 1; }
      100%   { opacity: 0; transform: translateY(-50px); }
    }
  </style>

  <!-- небо -->
  <rect width="800" height="340" fill="url(#sky)"/>
  <g fill="#fff">
    <circle class="star" cx="80"  cy="50"  r="2"/>
    <circle class="star s2" cx="210" cy="90" r="1.5"/>
    <circle class="star s3" cx="330" cy="35" r="2"/>
    <circle class="star s4" cx="560" cy="60" r="1.8"/>
    <circle class="star s2" cx="690" cy="110" r="2"/>
    <circle class="star" cx="740" cy="40" r="1.5"/>
  </g>
  <circle cx="650" cy="70" r="26" fill="#fff6c9"/>
  <circle cx="660" cy="63" r="24" fill="#1b1f4b" opacity=".0"/>

  <!-- облака -->
  <g class="cloud1" opacity=".85" fill="#e9defa">
    <ellipse cx="0" cy="80" rx="38" ry="14"/><ellipse cx="22" cy="72" rx="24" ry="14"/><ellipse cx="-20" cy="73" rx="20" ry="11"/>
  </g>
  <g class="cloud2" opacity=".7" fill="#e9defa">
    <ellipse cx="0" cy="140" rx="46" ry="16"/><ellipse cx="26" cy="130" rx="28" ry="15"/><ellipse cx="-24" cy="131" rx="24" ry="12"/>
  </g>

  <!-- земля -->
  <rect y="278" width="800" height="62" fill="#2f7d4f"/>
  <rect y="278" width="800" height="8" fill="#43a86b"/>
  <g fill="#43a86b">
    <path d="M60 278 l4 -12 l4 12z"/><path d="M150 278 l4 -10 l4 10z"/><path d="M600 278 l4 -12 l4 12z"/><path d="M710 278 l4 -10 l4 10z"/>
  </g>

  <!-- тень и пыль -->
  <ellipse class="shadow" cx="400" cy="290" rx="62" ry="9" fill="#000"/>
  <g fill="#d9f2e0">
    <circle class="dust" cx="330" cy="282" r="9"/>
    <circle class="dust" cx="470" cy="282" r="9"/>
    <circle class="dust" cx="305" cy="286" r="6"/>
    <circle class="dust" cx="495" cy="286" r="6"/>
  </g>

  <!-- сердечки -->
  <g fill="#ff6b8b">
    <path class="heart" d="M400 150 c-8 -10 -22 2 -10 12 l10 9 l10 -9 c12 -10 -2 -22 -10 -12z"/>
  </g>

  <!-- медведь -->
  <g class="bear">
    <!-- ноги -->
    <ellipse cx="368" cy="276" rx="26" ry="14" fill="#8a5326"/>
    <ellipse cx="432" cy="276" rx="26" ry="14" fill="#8a5326"/>
    <ellipse cx="368" cy="278" rx="14" ry="7" fill="#d9a066"/>
    <ellipse cx="432" cy="278" rx="14" ry="7" fill="#d9a066"/>
    <!-- тело -->
    <ellipse cx="400" cy="228" rx="52" ry="50" fill="url(#fur)"/>
    <ellipse cx="400" cy="238" rx="32" ry="34" fill="#e8bd8a"/>
    <!-- руки -->
    <ellipse class="armL" cx="345" cy="215" rx="13" ry="30" fill="#a86a33"/>
    <ellipse class="armR" cx="455" cy="215" rx="13" ry="30" fill="#a86a33"/>
    <!-- голова -->
    <circle cx="358" cy="150" r="17" fill="#8a5326"/><circle cx="358" cy="150" r="9" fill="#e8bd8a"/>
    <circle cx="442" cy="150" r="17" fill="#8a5326"/><circle cx="442" cy="150" r="9" fill="#e8bd8a"/>
    <circle cx="400" cy="175" r="52" fill="url(#fur)"/>
    <!-- морда -->
    <ellipse cx="400" cy="192" rx="24" ry="19" fill="#e8bd8a"/>
    <ellipse cx="400" cy="184" rx="8" ry="5.5" fill="#2b1a10"/>
    <path d="M400 190 v6 M400 196 q-7 7 -14 2 M400 196 q7 7 14 2" fill="none" stroke="#2b1a10" stroke-width="2.5" stroke-linecap="round"/>
    <!-- глаза -->
    <g class="blink">
      <circle cx="380" cy="166" r="6" fill="#2b1a10"/><circle cx="382" cy="164" r="2" fill="#fff"/>
      <circle cx="420" cy="166" r="6" fill="#2b1a10"/><circle cx="422" cy="164" r="2" fill="#fff"/>
    </g>
    <!-- щёки -->
    <circle cx="366" cy="187" r="6" fill="#ff9a8b" opacity=".6"/>
    <circle cx="434" cy="187" r="6" fill="#ff9a8b" opacity=".6"/>
  </g>
</svg>
